name: ggomool_back

services:
  postgres:
    image: postgres:17
    container_name: ggomool-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 590612
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ggomool-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
